name: ${name}
version: ${version}
main: com.ohtoai.skullshop.SkullShopPlugin
api-version: "1.20"
description: ${description}
author: OhtoAi
prefix: SkullShop
softdepend: [Vault, PlayerPoints]

permissions:
  skullshop.use:
    description: "Allow using /skullshop buy command"
    default: true
  skullshop.admin:
    description: "Allow /skullshop admin commands (reload, price set, currency toggle, setitem, allowother)"
    default: op

commands:
  skullshop:
    description: "SkullShop main command"
    usage: "/ss <buy|price|currency|allowother|setitem|reload|help>"
    aliases: [ss, hs]
