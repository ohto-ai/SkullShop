name: ${name}
version: ${version}
main: com.ohtoai.headshop.HeadShopPlugin
api-version: "1.20"
description: ${description}
author: OhtoAi
prefix: HeadShop
softdepend: [Vault, PlayerPoints]

permissions:
  headshop.use:
    description: "Allow using /headshop buy command"
    default: true
  headshop.admin:
    description: "Allow /headshop admin commands (reload, price set, currency toggle, setitem, allowother)"
    default: op

commands:
  headshop:
    description: "HeadShop main command"
    usage: "/hs <buy|price|currency|allowother|setitem|reload|help>"
    aliases: [hs]
